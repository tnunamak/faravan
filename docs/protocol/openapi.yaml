    "/v1/circles/{circle_id}/jobs/{job_digest}/transcript": {
      "get": {
        "operationId": "getLiveTranscript",
        "summary": "Read the current attempt transcript snapshot",
        "description": "Authenticated by the normal Faravan-Proof using current membership and the exact current accepted roster epoch; the signed proof binds that epoch, method, target, body digest and nonce. Only the job author and current attempt holder can read; circle ownership or administration alone grants no access. No query parameters are accepted. Returns the latest retained snapshot for the current attempt, or an empty snapshot: seq is 0, at is null, text is empty, and truncated is false. attempt is the current attempt UUID or null if there is no current attempt. Without a retained snapshot, available is true only when the current holder has a recent heartbeat advertising transcript_relay_v1; with no current attempt it is false. A retained snapshot, including an empty uploaded snapshot, remains readable after its attempt ends until it expires 24 hours after upload. The JSON response must fit the host response limit, which can be lower than 262,144 bytes.",
        "parameters": [
          {
            "name": "circle_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            }
          },
          {
            "name": "job_digest",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f]{64}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Current attempt snapshot or empty snapshot",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LiveTranscriptSnapshot"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Problem"
          },
          "401": {
            "$ref": "#/components/responses/Problem"
          },
          "403": {
            "$ref": "#/components/responses/Problem"
          },
          "404": {
            "$ref": "#/components/responses/Problem"
          },
          "409": {
            "$ref": "#/components/responses/Problem"
          },
          "410": {
            "$ref": "#/components/responses/Problem"
          },
          "413": {
            "$ref": "#/components/responses/Problem"
          },
          "422": {
            "$ref": "#/components/responses/Problem"
          },
          "429": {
            "$ref": "#/components/responses/Problem"
          },
          "500": {
            "$ref": "#/components/responses/Problem"
