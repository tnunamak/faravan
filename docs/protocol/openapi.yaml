{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "Faravan coordinator proposed v1 protocol",
    "version": "1.0.0",
    "description": "Design specification, not an implementation claim. JSON syntax is valid YAML 1.2. Normative cross-field, cryptographic, freshness and concurrency invariants are in v1.md. Every protocol operation requires Faravan-Proof, except three public reads that return only public material: the static landing pages GET /join and GET /i/{code}, and GET /v1/invites/{code}. Bootstrap enrollment is narrowly restricted to a root-signed invite/new device, not current membership. All writes other than bootstrap require current device membership. Standalone component schemas mirror the five adjacent JSON Schema files. All JSON POSTs require Idempotency-Key. Explicit error responses conservatively cover the shared transport problem mapping; not every problem is reachable for every operation. Operation-specific conditions remain normative in v1.md."
  },
  "servers": [
    {
      "url": "https://coordinator.example"
    }
  ],
  "security": [
    {
      "DeviceProof": []
    }
  ],
  "paths": {
    "/join": {
      "get": {
        "operationId": "getJoinLanding",
        "summary": "Read the private-by-default invitation landing page",
        "description": "Exact GET /join only, without a query or trailing slash. No enrollment occurs here. The URL fragment is decoded only in the browser, removed from history and never transmitted. Display names remain unverified until the app checks the invite. There are no external requests, links or analytics. Install/open/paste instructions and user-triggered full-link copying are local.",
