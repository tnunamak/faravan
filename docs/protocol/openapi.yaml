            "const": true
          },
          "compute_stopped": {
            "type": "boolean"
          },
          "attempt": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Attempt"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "job_digest",
          "cancellation_digest",
          "requested_at",
          "authority_revoked",
          "compute_stopped",
          "attempt"
        ]
      },
      "EnrollmentRequest": {
