  "components": {
    "securitySchemes": {
      "DeviceProof": {
        "type": "apiKey",
        "in": "header",
        "name": "Faravan-Proof",
        "description": "Unpadded base64url JCS RequestProof; Ed25519 domain faravan/request/v1 followed by NUL and raw SHA-256 payload digest. Binds absolute target including query, method, circle, body digest and length, content type, idempotency key, nonce, key and roster epoch. See v1.md."
      }
    },
    "schemas": {
      "Job": {
        "title": "Faravan v1 job",
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "payload": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "schema": {
                "const": "faravan.job.v1"
              },
              "circle": {
                "type": "string",
                "format": "uuid"
              },
              "author": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              "roster_epoch": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "intent_id": {
                "type": "string",
                "format": "uuid"
              },
              "created_at": {
                "type": "string",
                "format": "date-time",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
              },
              "expires_at": {
                "type": "string",
                "format": "date-time",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
              },
              "source": {
                "$ref": "#/components/schemas/Job/$defs/source"
              },
              "prompt": {
                "$ref": "#/components/schemas/Job/$defs/artifact"
              },
              "requirements": {
                "$ref": "#/components/schemas/Job/$defs/requirements"
              },
              "verify": {
                "description": "Fixed before signing; requires the verify_v1 capability. Omitted on legacy jobs and on downgrade.",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "cmd": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 4096,
                    "pattern": "^[^\\u0000-\\u001f\\u007f]+$"
                  }
                },
                "required": [
                  "cmd"
                ]
              },
              "parent": {
                "description": "Requester-signed link to the exact earlier job and result used as this follow-up's base. Requires parent_link_v1 on host and lender.",
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "job_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  },
                  "result_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  }
                },
                "required": [
                  "job_digest",
                  "result_digest"
                ]
              },
              "input_protection": {
                "const": "none"
              },
              "max_attempts": {
                "type": "integer",
                "minimum": 1,
                "maximum": 3
              },
              "budget_v1": {
                "type": "object",
                "additionalProperties": false,
                "description": "Optional budget_v1 extension; amounts are whole list-price US dollars (v1 numeric profile).",
                "properties": {
                  "max_list_usd": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100000
                  },
                  "effort": {
                    "enum": [
                      "none",
                      "minimal",
                      "low",
                      "medium",
                      "high",
                      "xhigh",
                      "max"
                    ]
                  }
                },
                "minProperties": 1
              }
            },
            "required": [
              "schema",
              "circle",
              "author",
              "roster_epoch",
              "intent_id",
              "created_at",
              "expires_at",
              "source",
              "prompt",
              "requirements",
              "input_protection",
              "max_attempts"
            ]
          },
          "signature": {
            "$ref": "#/components/schemas/Job/$defs/signature"
          }
        },
        "required": [
          "payload",
          "signature"
        ],
        "$defs": {
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "time": {
            "type": "string",
            "format": "date-time",
            "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
          },
          "uuid": {
            "type": "string",
            "format": "uuid"
          },
          "key": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          },
          "signature": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "algorithm": {
                "const": "Ed25519"
              },
              "key_id": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              "value": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{86}$"
              }
            },
            "required": [
              "algorithm",
              "key_id",
              "value"
            ]
          },
          "artifact": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "digest": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              "bytes": {
                "type": "integer",
                "minimum": 0,
                "maximum": 1073741824
              },
              "media_type": {
                "enum": [
                  "application/gzip",
                  "text/x-diff",
                  "text/plain",
                  "application/x-ndjson"
                ]
              }
            },
            "required": [
              "digest",
              "bytes",
              "media_type"
            ]
          },
          "limits": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "wall_seconds": {
                "type": "integer",
                "minimum": 1,
                "maximum": 86400
              },
              "cpu": {
                "type": "integer",
                "minimum": 1,
                "maximum": 256
              },
              "memory_bytes": {
                "type": "integer",
                "minimum": 1048576,
                "maximum": 1099511627776
              },
              "disk_bytes": {
                "type": "integer",
                "minimum": 1048576,
                "maximum": 1099511627776
              },
              "output_bytes": {
                "type": "integer",
                "minimum": 1,
                "maximum": 1073741824
              }
            },
            "required": [
              "wall_seconds",
              "cpu",
              "memory_bytes",
              "disk_bytes",
              "output_bytes"
            ]
          },
          "requirements": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "harness": {
                "type": "array",
                "items": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 4096
                },
                "maxItems": 128,
                "uniqueItems": true,
                "minItems": 1
              },
              "model": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "any_of": {
                    "type": "array",
                    "items": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 4096
                    },
                    "maxItems": 128,
                    "uniqueItems": true,
                    "minItems": 1
                  }
                },
                "required": [
                  "any_of"
                ]
              },
              "capabilities": {
                "type": "array",
                "items": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 4096
                },
                "maxItems": 128,
                "uniqueItems": true
              },
              "egress": {
                "enum": [
                  "provider-only",
                  "internet"
                ]
              },
              "limits": {
                "$ref": "#/components/schemas/Job/$defs/limits"
              },
              "limit_modes": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "wall_seconds": {
                    "enum": [
                      "required",
                      "preferred"
                    ]
                  },
                  "cpu": {
                    "enum": [
                      "required",
                      "preferred"
                    ]
                  },
                  "memory_bytes": {
                    "enum": [
                      "required",
                      "preferred"
                    ]
                  },
                  "disk_bytes": {
                    "enum": [
                      "required",
                      "preferred"
                    ]
                  },
                  "output_bytes": {
                    "enum": [
                      "required",
                      "preferred"
                    ]
                  }
                },
                "description": "Optional per-limit modes. Each omitted mode is required; preferred limits do not prevent matching."
              }
            },
            "required": [
              "capabilities",
              "egress",
              "limits"
            ]
          },
          "source": {
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "const": "git"
                  },
                  "url": {
                    "type": "string",
                    "format": "uri",
                    "pattern": "^https://",
                    "maxLength": 4096
                  },
                  "object_format": {
                    "enum": [
                      "sha1",
                      "sha256"
                    ]
                  },
                  "commit": {
                    "type": "string",
                    "pattern": "^(?:[0-9a-f]{40}|[0-9a-f]{64})$"
                  }
                },
                "required": [
                  "kind",
                  "url",
                  "object_format",
                  "commit"
                ]
              },
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "kind": {
                    "const": "archive"
                  },
                  "artifact": {
                    "$ref": "#/components/schemas/Job/$defs/artifact"
                  }
                },
                "required": [
                  "kind",
                  "artifact"
                ]
              }
            ]
          }
        }
      },
      "Result": {
        "title": "Faravan v1 result",
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "payload": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "schema": {
                "const": "faravan.result.v1"
              },
              "circle": {
                "type": "string",
                "format": "uuid"
              },
              "job_digest": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              "attempt_id": {
                "type": "string",
                "format": "uuid"
              },
              "generation": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "executor": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              "roster_epoch": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "submitted_at": {
                "type": "string",
                "format": "date-time",
                "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
              },
              "candidate": {
                "$ref": "#/components/schemas/Job/$defs/artifact"
              },
              "transcript": {
                "$ref": "#/components/schemas/Job/$defs/artifact"
              },
              "checks": {
                "description": "Optional verify_v1 sandbox observations; old results omit this field.",
                "type": "array",
                "maxItems": 1,
                "items": {
                  "$ref": "#/components/schemas/Receipt/$defs/check"
                }
              },
              "receipt": {
                "$ref": "#/components/schemas/Receipt"
              }
            },
            "required": [
              "schema",
              "circle",
              "job_digest",
              "attempt_id",
              "generation",
              "executor",
              "roster_epoch",
              "submitted_at",
              "candidate",
              "transcript",
              "receipt"
            ]
          },
          "signature": {
            "$ref": "#/components/schemas/Job/$defs/signature"
          }
        },
        "required": [
          "payload",
          "signature"
        ]
      },
      "Receipt": {
        "title": "Faravan v1 receipt",
        "type": "object",
        "additionalProperties": false,
        "$defs": {
          "check": {
            "description": "One command Faravan ran in the same sandbox after the agent finished (verify_v1). Observed by the sandbox, never reported by the agent. It travels in result.payload.checks beside this receipt, not inside it.",
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "cmd": {
                "$ref": "#/components/schemas/Job/properties/payload/properties/verify/properties/cmd"
              },
              "exit": {
                "type": [
                  "integer",
                  "null"
                ],
                "minimum": 0,
                "maximum": 255
              },
              "timed_out": {
                "type": "boolean"
              },
              "duration_ms": {
                "description": "Observed monotonic duration of this check, in milliseconds. Omitted when not measured.",
                "type": "integer",
                "minimum": 0,
                "maximum": 9007199254740991
              },
              "timeout_ms": {
                "description": "Actual enforced time limit for this check, in milliseconds. Omitted when not known; never inferred from the whole job budget.",
                "type": "integer",
                "minimum": 0,
                "maximum": 9007199254740991
              },
              "parser": {
                "enum": [
                  "npm",
                  "vitest",
                  "jest",
                  "pytest",
                  null
                ]
              },
              "summary": {
                "type": "string",
                "maxLength": 120
              },
              "observed_by": {
                "const": "sandbox"
