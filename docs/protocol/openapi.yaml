          "attempt_id": {"type": "string", "format": "uuid"},
          "job_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
          "generation": {"type": "integer", "minimum": 1, "maximum": 9007199254740991},
          "requested_at": {"type": "string", "format": "date-time", "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"}
        },
        "required": ["attempt_id", "job_digest", "generation", "requested_at"]
