            "required": [
              "circle",
              "invite_id",
              "device_public_key"
            ]
          },
          "signature": {
            "$ref": "#/components/schemas/Job/$defs/signature"
          }
        },
        "required": [
          "payload",
          "signature"
        ],
        "description": "Signature by registered invite key over faravan/enrollment/v1 + NUL + SHA256(JCS(payload)); independent of the new-device request proof."
      },
