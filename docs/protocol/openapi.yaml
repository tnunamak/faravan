      "Capabilities": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "protocol": {
            "const": "1.0"
          },
          "circle": {
            "type": "string",
            "format": "uuid"
          },
          "root_fingerprint": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "roster_epoch": {
            "type": "integer",
            "minimum": 1
          },
          "lease": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "min_seconds": {
                "const": 30
              },
              "default_seconds": {
                "const": 120
              },
              "max_seconds": {
                "const": 300
              }
            },
            "required": [
              "min_seconds",
              "default_seconds",
              "max_seconds"
            ]
          },
          "max_claim_wait_seconds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 30
          },
          "max_page_size": {
            "const": 100
          },
          "max_attempts": {
            "const": 3
          },
          "idempotency_retention_seconds": {
            "const": 86400
          },
          "terminal_retention_seconds": {
            "type": "integer",
            "minimum": 2592000
          },
          "roster_max_lifetime_seconds": {
            "const": 2592000
          },
          "max_artifact_bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1073741824
          },
          "device_storage_quota_bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "circle_storage_quota_bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 9007199254740991
          },
          "max_json_bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 262144
          },
          "supported_capabilities": {
            "type": "array",
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "maxItems": 128
          },
          "supported_egress": {
            "type": "array",
            "items": {
              "enum": [
                "provider-only",
                "internet"
              ]
            },
            "uniqueItems": true
          },
          "input_protection": {
            "const": [
              "none"
            ]
          },
          "archive_policy": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "max_entries": {
                "const": 100000
              },
              "max_expanded_bytes": {
                "const": 10737418240
              },
              "max_depth": {
                "const": 64
              },
              "max_path_bytes": {
                "const": 4096
              }
            },
            "required": [
              "max_entries",
              "max_expanded_bytes",
              "max_depth",
              "max_path_bytes"
            ]
          },
          "max_concurrent_uploads_per_device": {
            "type": "integer",
            "minimum": 1
          },
          "artifact_head": {
            "type": "boolean",
            "description": "When true, authenticated artifact HEAD is supported."
          },
          "faravan": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$",
            "description": "P22: the host's Faravan version, or null."
          },
          "min_member": {
            "type": [
              "string",
              "null"
            ],
            "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$",
            "description": "P22: the oldest member version the host works with, or null."
          },
          "capabilities": {
            "type": "array",
            "maxItems": 32,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-z0-9_]{1,40}$"
            },
            "description": "P22: what this host can do (heartbeat_v1, presence_v1, progress_v1, leave_v1, short_invite_v1, network_requirements_v1, retention_v1, offers_v1). A host that predates P22 omits it."
          }
        },
        "required": [
          "protocol",
          "circle",
          "root_fingerprint",
          "roster_epoch",
          "lease",
          "max_claim_wait_seconds",
          "max_page_size",
          "max_attempts",
          "idempotency_retention_seconds",
          "terminal_retention_seconds",
          "roster_max_lifetime_seconds",
          "max_artifact_bytes",
          "device_storage_quota_bytes",
          "circle_storage_quota_bytes",
          "max_json_bytes",
          "supported_capabilities",
          "supported_egress",
          "input_protection",
          "archive_policy",
          "max_concurrent_uploads_per_device"
        ]
      },
      "EnrollmentProof": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "payload": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "circle": {
                "type": "string",
                "format": "uuid"
              },
              "invite_id": {
                "type": "string",
                "format": "uuid"
              },
              "device_public_key": {
