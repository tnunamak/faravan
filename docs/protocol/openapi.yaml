          }
        }
      },
      "post": {
        "operationId": "postLiveTranscript",
        "summary": "Upload the current attempt transcript snapshot",
        "description": "Authenticated by the normal Faravan-Proof using current membership and the exact current accepted roster epoch; the signed proof binds that epoch, method, target, body digest and nonce. Only the current attempt holder can upload, and the attempt must be current, started, active, and have an unexpired lease on a nonterminal job. The body is canonical JSON; text is an already-redacted opaque NDJSON snapshot of at most 65,536 UTF-8 bytes. The canonical request body is at most 262,144 bytes (a host may configure a smaller JSON body limit). Accepted sequences increase strictly; gaps are allowed. Uploads are at least two host-clock seconds apart and each attempt accepts at most 2,048 uploads. The accepted snapshot and its available:true response must also fit the host JSON response limit. Normal POST idempotency applies.",
        "parameters": [
          {
            "name": "circle_id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            }
          },
          {
            "name": "job_digest",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-f]{64}$"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9._~-]{1,128}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "description": "Exact four-field request. The UTF-8 byte limit on text and canonical JSON body limit are enforced by the server.",
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LiveTranscriptUpload"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Accepted upload acknowledgement; only this acknowledgement is retained for POST idempotency replay",
