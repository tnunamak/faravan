    "/v1/circles/{circle_id}/rosters/{epoch}": {
      "get": {
        "operationId": "getHistoricalRoster",
        "summary": "Read the exact root-signed historical roster using current membership",
        "description": "The positive integer epoch selects history only. Authorization always uses current membership, including when the proof names an older cached epoch. Removed devices cannot read historical rosters. Clients verify the pinned root, circle and exact requested epoch without lowering their current roster high-water mark.",
