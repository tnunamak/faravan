    "/v1/invites/{code}": {
      "get": {
        "operationId": "resolveInvite",
        "summary": "Read a published invite by its short code (public, rate limited)",
        "description": "The only unauthenticated protocol read. Returns the public root-signed Invite and the owner device's invite binding; never a seed. A joiner MUST rebuild the invite key from the link's seed, check it equals envelope.payload.invite_public_key and verify the binding before trusting anything in the envelope. Limited per socket source (30 per 60 seconds). Unknown code is 404 not_found; expired invite is 410 enrollment_expired; over the limit is 429 rate_limited.",
        "security": [],
        "parameters": [
          {
            "name": "code",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[a-z2-7]{10}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Public invite material",
            "content": {
              "application/json": {
                "schema": {
