      "MemberProfileHeartbeat": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "capabilities"
        ],
        "description": "Capability-only heartbeats preserve lending state and online status. Once membership is approved, member_profile_v1 hosts also accept a person-name profile. They retain the exact body and Faravan-Proof and return them as member_profile on the member presence row. Readers independently verify the member signature, body digest, circle, key and heartbeat target before displaying or caching the name. Enrollment proofs and rosters keep their legacy wire form.",
        "properties": {
          "capabilities": {
            "type": "array",
            "maxItems": 32,
            "uniqueItems": true,
            "items": {
              "type": "string",
              "pattern": "^[a-z0-9_]{1,40}$"
            }
          },
          "profile": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "person_name",
              "revision"
            ],
            "properties": {
              "person_name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "description": "No control, format or line-separator characters or edge spaces. Missing profiles fall back to the device name."
              },
              "revision": {
                "type": "integer",
                "minimum": 0,
                "maximum": 9007199254740991,
                "description": "Persistent per-device name revision. Hosts and readers retain only strictly newer revisions, independently of request timestamps."
              }
            }
          }
        }
      }
    },
    "responses": {
      "Problem": {
        "description": "RFC 9457 problem; stable code/status mapping and retry semantics in v1.md",
        "content": {
          "application/problem+json": {
            "schema": {
              "$ref": "#/components/schemas/Problem"
            }
          }
        }
      }
    }
