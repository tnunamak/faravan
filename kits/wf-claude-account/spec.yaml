schemaVersion: "3"
kind: mixin
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow: [api.anthropic.com:443]
  - type: com.docker.sandbox/credential@1
    config:
      service: faravan-claude
      phase: runtime
      apiKey:
        name: CLAUDE_CODE_OAUTH_TOKEN
        proxyManaged: true
        inject:
          - domain: api.anthropic.com
            header: Authorization
            format: "Bearer %s"
