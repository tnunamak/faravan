regexTarget = "line"
paths = ["(^|/)tests/v1-lender-pace50-cleanup-journal\\.test\\.mjs$"]
regexes = [
  "^\n?    leaseSeconds: 120, idempotencyKey: 'r4-orphaned-accepted-claim', acceptedAt: f\\.clock\\.now\\(\\)\\};$",
]

# Synthetic test identifiers for model lookup, lease idempotency, or resource generations; no service credentials.
[[rules.allowlists]]
description = "Synthetic test identifiers for model lookup, lease idempotency, or resource generations; no service credentials."
condition = "AND"
regexTarget = "line"
paths = ["(^|/)tests/v1-lender\\.test\\.mjs$"]
