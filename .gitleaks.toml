# Preserve default detectors. Rule-level exceptions require both exact path and exact line.
[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

# Public PostHog ingestion project identifier, embedded in the shipped client; not an administrative key.
[[rules.allowlists]]
description = "Public PostHog ingestion project identifier, embedded in the shipped client; not an administrative key."
condition = "AND"
regexTarget = "line"
paths = ["(^|/)lib/v1/telemetry/contract\\.mjs$"]
regexes = [
  "^\n?export const POSTHOG_TOKEN = 'phc_nFhRBipngqr9ptSzJnSuCJTD4xAvrCHQiLbvmZPEBUY6';$",
]

# Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate.
[[rules.allowlists]]
description = "Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate."
condition = "AND"
regexTarget = "line"
paths = ["(^|/)tests/credential-probe\\.test\\.mjs$"]
regexes = [
  "^\n?    \\['\\.docker/config\\.json', '\\{\"auths\":\\{\"https://index\\.docker\\.io/v1/\":\\{\"auth\":\"dXNlcjpBYmNkMTIzNDU2Nzg5MDEyMw==\"\\}\\}\\}'\\],$",
  "^\n?  assert\\.ok\\(kinds\\('\\{\"auths\":\\{\"https://index\\.docker\\.io/v1/\":\\{\"auth\":\"dXNlcjpBYmNkMTIzNDU2Nzg5MDEyMw==\"\\}\\}\\}'\\)\\.includes\\('real'\\), 'docker config'\\);$",
  "^\n?  await writeFile\\(file, JSON\\.stringify\\(\\{ tokens: \\{ access_token: FAKE_JWT, refresh_token: 'Rq8Xw2Lp5Vb9Nk3Ys7Hd1Mc4Fj6Ga0Tz', plain: 'short' \\} \\}\\)\\);$",
  "^\n?  const hostSecret = 'Rq8Xw2Lp5Vb9Nk3Ys7Hd1Mc4Fj6Ga0TzUe2Io';$",
  "^\n?  for \\(const leak of \\[FAKE_ANTHROPIC, FAKE_JWT, FAKE_GITHUB, 'accessToken: \"Qx9Lm4Zp7Rk2Vc5Bn8Ty3Wd6\"'\\]\\) \\{$",
]

# Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate.
[[rules.allowlists]]
description = "Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate."
condition = "AND"
regexTarget = "line"
paths = ["(^|/)tests/docker-login-create-evidence\\.test\\.mjs$"]
regexes = [
  "^\n?  const secret = 'dckr_pat_SYNTHETICSECRET123';$",
]

