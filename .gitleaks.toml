# Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate.
[[rules.allowlists]]
description = "Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate."
condition = "AND"
regexTarget = "line"
paths = ["(^|/)tests/owner-isolation\\.test\\.mjs$"]
regexes = [
  "^\n?    await writeFile\\(f\\.file,JSON\\.stringify\\(\\{\\.\\.\\.f\\.value,github_token:'ghp_Ab9Cd8Ef7Gh6Ij5Kl4Mn3Op2Qr1St0Uv'\\}\\)\\);$",
]

# Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate.
[[rules.allowlists]]
description = "Synthetic planted credentials and canary strings used to test rejection, redaction, or isolation; never authenticate."
condition = "AND"
regexTarget = "line"
paths = ["(^|/)tests/v1-diagnostics\\.test\\.mjs$"]
regexes = [
  "^\n?const CANARIES = \\['PLANTED_SECRET_4c86', 'PLANTED_PROMPT_4c86', 'PLANTED_TRANSCRIPT_4c86', 'private-host-4c86\\.internal',$",
]

# Synthetic test identifiers for model lookup, lease idempotency, or resource generations; no service credentials.
[[rules.allowlists]]
description = "Synthetic test identifiers for model lookup, lease idempotency, or resource generations; no service credentials."
